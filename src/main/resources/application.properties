# Strava account details.
strava.client.id=${STRAVA_CLIENT_ID:14826}
strava.client.secret=${STRAVA_CLIENT_SECRET:c9223933a427f5854af450ea3b7a71b46a3dca4d}
strava.redirect.uri=${STRAVA_REDIRECT_URI:http://localhost:8080/oauth/callback}

# Roll logs daily, cap total log size.
logging.level.net.jon=DEBUG
logging.level.root=INFO
logging.file.name=strava.log
logging.logback.rollingpolicy.file-name-pattern=${LOG_FILE}.%d{yyyy-MM-dd}.%i.gz
logging.logback.rollingpolicy.total-size-cap=100MB

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/strava}
spring.datasource.username=${DATABASE_USERNAME:jon}
spring.datasource.password=${DATABASE_PASSWORD:LewinsRail1}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=strava
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true

# Railway terminates TLS and proxies over plain HTTP; trust X-Forwarded-* so
# Tomcat/springdoc report https (fixes swagger-ui generating http:// curl commands).
server.forward-headers-strategy=native

# CORS.
cors.allowedOrigins=${CORS_ALLOWED_ORIGINS:strava-ui-production.up.railway.app}

